<style>
/* Layout: editorial single column on a 12-col grid. Sticky glass nav -> hero (thesis left, fact sheet right)
   -> proof strip -> project rows (open into a case-study drawer) -> skills -> experience ledger -> contact. */
:root {
  --bg: #0b0c0e; --bg2: #101216; --surface: rgba(255,255,255,.028); --surface-hi: rgba(255,255,255,.06);
  --line: rgba(255,255,255,.09); --line-hi: rgba(255,255,255,.2);
  --fg: #eceef1; --muted: #a0a6b0; --faint: #6f7681;
  --accent: #6cd7ea; --accent-ink: #04161a; --accent-soft: rgba(108,215,234,.1); --glow: rgba(108,215,234,.22);
  --code-bg: #0e1014; --nav-bg: rgba(11,12,14,.78);
  --font: -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","HarmonyOS Sans SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC",system-ui,sans-serif;
  --mono: ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono","PingFang SC","Microsoft YaHei",monospace;
  --gutter: clamp(20px, 4vw, 40px);
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #f8f8f6; --bg2: #f0f0ed; --surface: rgba(12,14,18,.03); --surface-hi: rgba(12,14,18,.06);
  --line: rgba(12,14,18,.11); --line-hi: rgba(12,14,18,.26);
  --fg: #111318; --muted: #4f5560; --faint: #7a808a;
  --accent: #0b7b91; --accent-ink: #fff; --accent-soft: rgba(11,123,145,.09); --glow: rgba(11,123,145,.18);
  --code-bg: #efeeea; --nav-bg: rgba(248,248,246,.82); color-scheme: light;
}
html { scroll-behavior: smooth; scroll-padding-top: 72px; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15.5px; line-height: 1.8; -webkit-font-smoothing: antialiased; overflow-x: hidden; line-break: strict; }
::selection { background: var(--accent); color: var(--accent-ink); }
a { color: inherit; text-decoration: none; }
button { font: inherit; }
.wrap { max-width: 1120px; margin-inline: auto; padding-left: max(var(--gutter), env(safe-area-inset-left, 0px)); padding-right: max(var(--gutter), env(safe-area-inset-right, 0px)); }
.mono { font-family: var(--mono); }
.minw0 { min-width: 0; }
.label { font-family: var(--mono); font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); }
.label.acc-c { color: var(--accent); }
.top-glow { position: fixed; inset: 0 0 auto 0; height: 520px; z-index: -1; pointer-events: none; background: radial-gradient(700px 360px at 80% -10%, var(--glow), transparent 70%); }

/* nav */
nav.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; background: var(--nav-bg); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
.nav-in { height: 60px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.brand { white-space: nowrap; font-weight: 500; letter-spacing: .02em; display: flex; align-items: baseline; gap: 10px; }
.brand small { font-family: var(--mono); font-size: 11.5px; color: var(--faint); letter-spacing: .04em; }
.navlinks { display: flex; align-items: center; gap: 4px; }
.navlinks a { font-size: 13.5px; color: var(--muted); padding: 6px 12px; border-radius: 6px; transition: color .15s, background .15s; }
.navlinks a:hover { color: var(--fg); background: var(--surface-hi); }

/* controls */
.btn { display: inline-flex; align-items: center; gap: 8px; height: 42px; padding: 0 18px; border-radius: 8px; font-size: 14px; font-weight: 500; border: 1px solid var(--line-hi); color: var(--fg); background: transparent; cursor: pointer; transition: border-color .15s, background .15s, transform .15s; white-space: nowrap; }
.btn:hover { border-color: var(--accent); background: var(--accent-soft); }
.btn.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.btn.primary:hover { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.sm { height: 36px; padding: 0 14px; font-size: 13px; }
.iconbtn { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; flex: none; }
.iconbtn:hover { border-color: var(--accent); }
.icon { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.chip { display: inline-flex; align-items: center; font-family: var(--mono); font-size: 11.5px; line-height: 1; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.chip.hot { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
.tab { height: 34px; padding: 0 14px; border-radius: 6px; border: 1px solid transparent; background: transparent; color: var(--muted); font-size: 13.5px; cursor: pointer; transition: all .15s; }
.tab:hover { color: var(--fg); }
.tab[aria-pressed="true"] { color: var(--fg); background: var(--surface-hi); border-color: var(--line); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* hero */
.hero { padding-block: clamp(56px, 9vw, 112px) clamp(48px, 7vw, 80px); display: grid; gap: clamp(36px, 5vw, 72px); grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); align-items: start; }
.hero h1 { font-size: clamp(30px, 4.2vw, 50px); line-height: 1.25; font-weight: 500; letter-spacing: -.01em; margin: 18px 0 0; text-wrap: balance; }
.hero h1 em { font-style: normal; color: var(--accent); }
.hero .lead { margin: 26px 0 0; color: var(--muted); font-size: 16.5px; line-height: 1.9; max-width: 36em; }
.hero .lead b { color: var(--fg); font-weight: 500; }
.cta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 34px; }
.sheet { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
.sheet .row { display: grid; grid-template-columns: 84px minmax(0,1fr); gap: 14px; padding: 15px 20px; border-top: 1px solid var(--line); align-items: start; }
.sheet .row:first-child { border-top: 0; }
.sheet dt { font-size: 12.5px; color: var(--faint); padding-top: 2px; }
.sheet dd { margin: 0; font-size: 14.5px; line-height: 1.65; }
.sheet dd small { display: block; color: var(--muted); font-size: 13px; }
.copyline { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.copyline span { font-family: var(--mono); font-size: 14px; letter-spacing: .01em; overflow-wrap: anywhere; }
.copybtn { background: transparent; border: 1px solid var(--line); color: var(--muted); border-radius: 6px; width: 30px; height: 30px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; flex: none; }
.copybtn:hover { color: var(--fg); border-color: var(--accent); }

/* proof strip */
.proof { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.proof > button { text-align: left; background: transparent; border: 0; border-left: 1px solid var(--line); padding: 28px 24px 30px; cursor: pointer; color: inherit; transition: background .2s; display: flex; flex-direction: column; gap: 8px; }
.proof > button:first-child { border-left: 0; padding-left: 0; }
.proof > button:hover { background: var(--surface); }
.proof .big { font-size: clamp(24px, 2.6vw, 32px); font-weight: 500; letter-spacing: -.02em; line-height: 1.15; font-variant-numeric: tabular-nums; }
.proof .big i { font-style: normal; color: var(--faint); margin-inline: .12em; font-weight: 300; }
.proof .what { font-size: 13.5px; font-weight: 500; }
.proof .how { font-size: 13px; color: var(--muted); line-height: 1.7; }
.proof .src { font-family: var(--mono); font-size: 11px; color: var(--accent); margin-top: auto; padding-top: 6px; }

/* sections */
.sec { padding-block: clamp(64px, 9vw, 112px) 0; }
.sec-head { display: grid; grid-template-columns: 200px minmax(0,1fr); gap: 20px 48px; margin-bottom: clamp(28px, 4vw, 44px); align-items: start; }
.sec-head h2 { margin: 0; font-size: clamp(22px, 2.6vw, 30px); font-weight: 500; line-height: 1.4; letter-spacing: -.01em; text-wrap: balance; }
.sec-head p { margin: 10px 0 0; color: var(--muted); max-width: 40em; }

/* work rows */
.rows { border-top: 1px solid var(--line); }
.work { display: grid; grid-template-columns: minmax(0,1fr) 300px; gap: 28px 56px; width: 100%; text-align: left; background: transparent; border: 0; border-bottom: 1px solid var(--line); padding: 36px 0; cursor: pointer; color: inherit; position: relative; transition: padding .25s; }
.work::before { content: ""; position: absolute; inset: 0 calc(-1 * var(--gutter)); background: var(--surface); opacity: 0; transition: opacity .2s; z-index: -1; }
.work:hover::before { opacity: 1; }
.work .meta { display: flex; flex-wrap: wrap; gap: 6px 16px; font-family: var(--mono); font-size: 11.5px; color: var(--faint); letter-spacing: .04em; }
.work h3 { margin: 12px 0 2px; font-size: clamp(20px, 2.2vw, 25px); font-weight: 500; line-height: 1.4; }
.work .en { font-family: var(--mono); font-size: 12px; color: var(--accent); }
.work .pitch { margin: 14px 0 0; color: var(--muted); max-width: 40em; }
.work .flow { margin: 16px 0 0; font-family: var(--mono); font-size: 12px; line-height: 1.8; color: var(--faint); }
.work .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 18px; }
.mgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 0; align-self: start; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.mgrid > div { padding: 16px 16px 14px; border-top: 1px solid var(--line); border-left: 1px solid var(--line); }
.mgrid > div:nth-child(-n+2) { border-top: 0; }
.mgrid > div:nth-child(odd) { border-left: 0; }
.mgrid b { display: block; font-size: 21px; font-weight: 500; letter-spacing: -.02em; line-height: 1.2; font-variant-numeric: tabular-nums; }
.mgrid span { display: block; font-size: 12px; color: var(--muted); margin-top: 4px; line-height: 1.5; }
.open-hint { display: inline-flex; align-items: center; gap: 6px; margin-top: 20px; font-size: 13px; color: var(--accent); }
.work:hover .open-hint .icon { transform: translateX(4px); }
.open-hint .icon { transition: transform .2s; }

/* skills */
.skills { display: grid; gap: 1px; grid-template-columns: repeat(2, minmax(0,1fr)); background: var(--line); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.skills > div { background: var(--bg); padding: 26px 28px; }
.skills h3 { margin: 0; font-size: 16px; font-weight: 500; }
.skills .sub { font-size: 12.5px; color: var(--faint); margin-bottom: 8px; }
.skillrow { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 11px 0; border-top: 1px solid var(--line); }
.skillrow .n { font-size: 14px; line-height: 1.5; }
.skillrow .e { font-size: 12px; color: var(--faint); line-height: 1.5; }
.meter { display: inline-flex; gap: 3px; flex: none; }
.meter i { width: 14px; height: 4px; border-radius: 2px; background: var(--line-hi); }
.meter i.on { background: var(--accent); }
.legend { display: flex; flex-wrap: wrap; gap: 8px 22px; font-size: 12.5px; color: var(--muted); margin-bottom: 18px; }
.legend span { display: inline-flex; align-items: center; gap: 8px; }

/* experience ledger */
.xp { display: grid; grid-template-columns: 260px minmax(0,1fr); gap: 12px 48px; padding: 34px 0; border-bottom: 1px solid var(--line); }
.xp .org { font-size: 21px; font-weight: 500; line-height: 1.4; color: var(--fg); letter-spacing: -.005em; }
.xp .sub { font-size: 13.5px; color: var(--muted); margin-top: 2px; line-height: 1.6; }
.xp .when { font-family: var(--mono); font-size: 11.5px; color: var(--faint); margin-top: 10px; line-height: 1.7; letter-spacing: .02em; }
.xp-group { font-family: var(--mono); font-size: 12px; letter-spacing: .12em; color: var(--accent); padding-bottom: 14px; border-bottom: 1px solid var(--line-hi); }
.xp h3 { margin: 0; font-size: 16.5px; font-weight: 500; line-height: 1.6; color: var(--fg); }
.xp .tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0 6px; }
.xp h4 { margin: 18px 0 4px; font-size: 13.5px; font-weight: 500; color: var(--fg); }
.xp ul { margin: 0; padding: 0; list-style: none; }
.xp li { position: relative; padding-left: 16px; margin: 6px 0; color: var(--muted); font-size: 14.5px; line-height: 1.8; }
.xp li::before { content: ""; position: absolute; left: 0; top: .95em; width: 6px; height: 1px; background: var(--faint); }

/* contact */
.contact { display: grid; grid-template-columns: minmax(0,1.2fr) minmax(0,1fr); gap: 40px 72px; align-items: start; }
.contact h2 { margin: 12px 0 0; font-size: clamp(26px, 3.4vw, 40px); font-weight: 500; line-height: 1.35; text-wrap: balance; }
.contact p { color: var(--muted); max-width: 32em; margin: 18px 0 0; }
footer { padding-block: 56px 48px; font-family: var(--mono); font-size: 11.5px; color: var(--faint); }

/* drawer (case study) */
.scrim { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.62); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); animation: fade .2s ease; }
.drawer { position: fixed; z-index: 61; top: 0; right: 0; bottom: 0; width: min(940px, 100vw); background: var(--bg2); border-left: 1px solid var(--line-hi); overflow-y: auto; overscroll-behavior: contain; animation: slide .28s cubic-bezier(.2,.7,.2,1); padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.drawer-in { padding: 32px max(24px, env(safe-area-inset-right, 0px)) 72px max(24px, env(safe-area-inset-left, 0px)); max-width: 860px; }
@keyframes fade { from { opacity: 0 } to { opacity: 1 } }
@keyframes slide { from { transform: translateX(28px); opacity: 0 } to { transform: none; opacity: 1 } }
.cs-sec { display: grid; grid-template-columns: 128px minmax(0,1fr); gap: 8px 28px; padding: 30px 0; border-top: 1px solid var(--line); }
.cs-sec > .label { padding-top: 5px; }
.cs-sec ul { margin: 0; padding: 0; list-style: none; }
.cs-sec li { position: relative; padding-left: 16px; margin: 8px 0; line-height: 1.85; }
.cs-sec li:first-child { margin-top: 0; }
.cs-sec li::before { content: ""; position: absolute; left: 0; top: .98em; width: 6px; height: 1px; background: var(--accent); }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 0; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin-top: 26px; }
.facts > div { padding: 16px 18px; border-top: 1px solid var(--line); border-left: 1px solid var(--line); }
.facts > div:nth-child(-n+2) { border-top: 0; }
.facts > div:nth-child(odd) { border-left: 0; }
.facts .k { font-size: 13.5px; font-weight: 600; letter-spacing: 0; color: var(--accent); }
.facts .v { margin-top: 4px; font-size: 14px; line-height: 1.7; }
.tt { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.tt .tr { display: grid; grid-template-columns: 1.1fr 1fr 1.7fr; gap: 6px 18px; padding: 14px 18px; border-top: 1px solid var(--line); font-size: 14px; line-height: 1.7; }
.tt .tr:first-child { border-top: 0; }
.tt .th { background: var(--surface); font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); padding-block: 10px; }
.tt .pick { color: var(--accent); }
.lane { display: grid; grid-template-columns: 76px minmax(0,1fr); gap: 12px; align-items: start; padding: 12px 0; border-top: 1px dashed var(--line); }
.lane:first-child { border-top: 0; }
.lane .ln { font-family: var(--mono); font-size: 11px; color: var(--faint); padding-top: 8px; letter-spacing: .08em; }
.nodes { display: flex; flex-wrap: wrap; gap: 8px; }
.node { padding: 7px 12px; border-radius: 8px; border: 1px solid var(--line-hi); background: var(--surface); font-size: 13px; line-height: 1.4; }
.node small { display: block; font-family: var(--mono); font-size: 10.5px; color: var(--accent); margin-top: 2px; }
.node.hub { border-color: var(--accent); background: var(--accent-soft); }
.glass { background: var(--surface); border: 1px solid var(--line); }
.codehead { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-family: var(--mono); font-size: 11.5px; color: var(--faint); margin-bottom: 8px; }
pre.code { margin: 0; padding: 16px 18px; background: var(--code-bg); border: 1px solid var(--line); border-radius: 12px; overflow-x: auto; font-family: var(--mono); font-size: 12.5px; line-height: 1.75; color: var(--fg); tab-size: 2; }
.acc { border-top: 1px solid var(--line); }
.acc:last-child { border-bottom: 1px solid var(--line); }
.acc > button { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 0; text-align: left; font-weight: 500; font-size: 14.5px; cursor: pointer; color: inherit; background: transparent; border: 0; }
.acc > button .icon { transition: transform .2s; color: var(--muted); }
.acc[data-open="true"] > button .icon { transform: rotate(180deg); }
.acc .ab { padding: 0 0 18px; color: var(--muted); font-size: 14.5px; line-height: 1.85; max-width: 44em; }
.note { border-left: 2px solid var(--line-hi); padding: 4px 0 4px 16px; color: var(--muted); font-size: 13.5px; line-height: 1.8; }

/* ---- dual view ---- */
.seg{display:inline-flex;padding:3px;gap:2px;border:1px solid var(--line);border-radius:10px;background:var(--surface);backdrop-filter:blur(10px)}
.seg button{font:inherit;font-size:13px;color:var(--muted);background:none;border:0;padding:7px 14px;border-radius:7px;cursor:pointer;white-space:nowrap;transition:.15s}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);font-weight:600}
.seg.compact button{padding:5px 10px;font-size:12px}
.viewbar{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin:26px 0 0}
.viewline{font-size:13px;color:var(--muted);max-width:46ch;line-height:1.6}
button.node{font:inherit;text-align:left;color:inherit;cursor:default}
button.node.has{cursor:pointer;text-decoration:underline dotted var(--muted);text-underline-offset:4px}
button.node.has:hover{border-color:var(--accent)}
button.node.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.topo-detail{margin-top:14px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);backdrop-filter:blur(10px);font-size:13.5px;line-height:1.7}
.topo-detail b{display:block;margin-bottom:4px;color:var(--fg)}
.topo-detail p{margin:0;color:var(--muted)}
.topo-detail .hint{color:var(--muted);font-size:12.5px}
.ctrl{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.ctrl>div{padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.ctrl b{display:block;font-size:13.5px;margin-bottom:4px}
.ctrl span{font-size:13px;color:var(--muted);line-height:1.65}
.pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.pillars>div{padding:20px;border:1px solid var(--line);border-radius:14px;background:var(--surface);backdrop-filter:blur(10px);transition:.2s}
.pillars>div:hover{border-color:var(--accent);transform:translateY(-2px)}
.pillars h3{margin:0 0 8px;font-size:16px}
.pillars p{margin:0 0 10px;font-size:13.5px;color:var(--muted);line-height:1.7}
.pillars ul{margin:0;padding-left:16px;font-size:12.5px;color:var(--muted);line-height:1.7}
@media (max-width:900px){.pillars{grid-template-columns:1fr}.ctrl{grid-template-columns:1fr}}
.proofgrp{margin-top:18px}
.proof-lab{display:flex;gap:12px;align-items:baseline;padding:14px 0 10px;font-size:12.5px;color:var(--muted)}
.proof-lab b{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;color:var(--accent);font-weight:500}
.proofgrp .proof{border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.proofgrp .proof > button{padding-top:22px;padding-bottom:22px}
.work{cursor:default}
.tagv{display:inline-block;font-family:var(--mono);font-size:10.5px;font-weight:500;color:var(--accent);border:1px solid var(--line-hi);border-radius:5px;padding:0 6px;margin-right:8px;line-height:1.7;vertical-align:1px}
.work .pitch{margin:8px 0 0}
.open-btns{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:18px}
.open-sub{font-size:12px;color:var(--faint)}
.mg+.mg{margin-top:14px}
.mg-t{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--faint);margin:0 0 6px}
.vtabs{margin:22px 0 0}
.vtabs-h{font-size:12.5px;color:var(--accent);margin-bottom:8px}
.vtabs-g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vtabs-g button{font:inherit;text-align:left;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;transition:.15s;display:flex;flex-direction:column;gap:4px}
.vtabs-g button:hover{border-color:var(--line-hi)}
.vtabs-g button b{font-size:15px;font-weight:600}
.vtabs-g button span{font-size:12px;color:var(--muted);line-height:1.55}
.vtabs-g button[aria-selected="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.vtabs-g button[aria-selected="true"] span{color:var(--bg);opacity:.75}
.vnext{margin-top:44px;padding:22px;border:1px solid var(--accent);border-radius:14px;background:var(--accent-soft);display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center;justify-content:space-between}
.vnext b{display:block;font-size:15px}
.vnext span{font-size:13px;color:var(--muted)}
@media (max-width:560px){.vtabs-g{grid-template-columns:1fr}.proof-lab{flex-direction:column;gap:2px}}
/* ---- section markers: larger, unmissable ---- */
.label{font-size:13px;letter-spacing:.1em}
.sec-head .label{font-size:14px;font-weight:600}
.xp-group{font-family:var(--font);font-size:clamp(20px,2.2vw,24px);font-weight:600;letter-spacing:0;color:var(--fg);padding:0 0 14px 14px;border-bottom:1px solid var(--line-hi);border-left:4px solid var(--accent);line-height:1.3}
.proof-lab{align-items:center;gap:14px;padding:22px 0 14px}
.proof-lab b{font-family:var(--font);font-size:clamp(20px,2.2vw,24px);font-weight:600;letter-spacing:0;color:var(--fg);padding-left:14px;border-left:4px solid var(--accent);line-height:1.3}
.proof-lab span{font-size:14px}
.mg-t{font-family:var(--font);font-size:14px;font-weight:600;letter-spacing:0;color:var(--accent);margin:0 0 8px}
.tagv{font-family:var(--font);font-size:13px;font-weight:600;padding:1px 8px;border-radius:6px;background:var(--accent-soft);border-color:var(--accent)}
.cs-sec{grid-template-columns:168px minmax(0,1fr)}
.cs-sec > .label{font-family:var(--font);font-size:17px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--fg);padding-top:0;line-height:1.5;padding-left:12px;border-left:3px solid var(--accent);align-self:start}
.sheet dt{font-size:14px;color:var(--muted)}
.skills .sub{font-size:13.5px}
.vtabs-h{font-size:14px;font-weight:600}
@media (max-width:900px){.cs-sec{grid-template-columns:minmax(0,1fr)}}
/* ---- BA charts ---- */
:root{--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--ok-ink:#052e16;--warn-ink:#2b1d02;--bad-ink:#2d0707}
:root[data-theme="light"]{--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--ok-ink:#fff;--warn-ink:#fff;--bad-ink:#fff}
.fig{border:1px solid var(--line);border-radius:14px;padding:18px;background:var(--surface);margin:0 0 16px}
.fig-t{font-size:15px;font-weight:600;margin:0 0 14px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline}
.fig-t small{font-size:12.5px;font-weight:400;color:var(--muted)}
.fig-cap{font-size:13px;color:var(--muted);margin-top:12px;line-height:1.7}
.sbar{display:flex;gap:3px;height:48px}
.sbar>div{display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;border-radius:8px;min-width:0;white-space:nowrap}
.sbar .a{background:var(--accent);color:var(--accent-ink)}
.sbar .b{background:var(--surface-hi);color:var(--fg);border:1px solid var(--line)}
.sann{display:flex;gap:3px;margin-top:10px;font-size:13px;line-height:1.6}
.sann>div{min-width:0}
.sann b{display:block;font-size:14px}
.sann .a b{color:var(--accent)}
.divsvg{width:100%;height:auto;display:block}
.divsvg text{font-family:var(--font);fill:var(--fg)}
.divsvg .m{fill:var(--muted);font-size:12px}
.steps{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));gap:0 26px;align-items:stretch}
.step{min-width:0;position:relative;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg2)}
.hero h1 em{white-space:nowrap}
.step::after{content:"→";position:absolute;right:-22px;top:50%;transform:translateY(-50%);color:var(--accent);font-size:16px}
.step:last-child::after{display:none}
.step b{display:block;font-size:14px;line-height:1.5}
.step span{display:block;font-size:12.5px;color:var(--muted);line-height:1.6;margin-top:3px}
.step.hot{border-color:var(--accent);background:var(--accent-soft)}
.health{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.health>div{border:1px solid var(--line);border-radius:10px;padding:10px 8px;text-align:center;background:var(--bg2)}
.health .st{font-size:13px;color:var(--muted);margin-bottom:6px}
.pill{display:inline-block;font-family:var(--mono);font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px}
.pill.ok{background:var(--ok);color:var(--ok-ink)}
.pill.warn{background:var(--warn);color:var(--warn-ink)}
.pill.bad{background:var(--bad);color:var(--bad-ink)}
.hl{font-size:13px;font-weight:600;margin:14px 0 8px}
.hl:first-child{margin-top:0}
.eq{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;font-size:15px}
.eq .t{padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg2);text-align:center;line-height:1.4}
.eq .t b{display:block;font-family:var(--mono);font-size:20px;font-weight:500}
.eq .t span{font-size:12px;color:var(--muted)}
.eq .t.r{border-color:var(--bad)}
.eq .t.r b{color:var(--bad)}
.eq i{font-style:normal;color:var(--faint)}
.units{display:flex;gap:6px;flex-wrap:wrap}
.units i{width:28px;height:28px;border-radius:6px;background:var(--surface-hi);border:1px solid var(--line)}
.units i.on{background:var(--accent);border-color:var(--accent)}
.fun{display:grid;gap:14px}
.fun .bar{box-sizing:border-box;height:42px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;padding:0 14px;font-weight:600;font-size:15px;min-width:110px}
.fun .fd{font-size:13px;color:var(--muted);margin-top:5px}
.tree{display:grid;gap:12px}
.tree .top{justify-self:center;padding:10px 18px;border:1px solid var(--accent);border-radius:10px;background:var(--accent-soft);font-weight:600;text-align:center}
.tree .top span{display:block;font-weight:400;font-size:12.5px;color:var(--muted)}
.tree .row4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tree .m{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--bg2)}
.tree .m b{display:block;font-size:14px;margin-bottom:8px;line-height:1.4}
.tree .m span{display:inline-block;font-family:var(--mono);font-size:11px;padding:3px 7px;margin:0 4px 4px 0;border:1px solid var(--line);border-radius:5px;color:var(--muted)}
.mt{width:100%;border-collapse:collapse;font-size:14px}
.mt th,.mt td{text-align:left;padding:10px 12px;border-top:1px solid var(--line);vertical-align:top;line-height:1.7}
.mt th{border-top:0;font-size:13px;color:var(--faint);font-weight:500}
.mt td:first-child{font-weight:600;white-space:nowrap}
.mt td span{color:var(--muted)}
.sk3{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.sk3>div{padding:22px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.sk3 h3{margin:0 0 4px;font-size:17px}
.sk3 .tools{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.sk3 p{margin:8px 0 0;font-size:14px;color:var(--muted);line-height:1.75}
.sk3 p b{color:var(--fg);font-weight:600}
.typ{display:inline-block;font-size:12.5px;font-weight:600;padding:2px 9px;border-radius:6px;border:1px solid var(--accent);color:var(--accent);background:var(--accent-soft);margin-right:10px;vertical-align:1px}
.pillars.p4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1100px){.pillars.p4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.mt th,.mt td{padding:8px 5px;font-size:12.5px;word-break:break-word}.mt td:first-child{white-space:normal}.pillars.p4{grid-template-columns:1fr}}
@media (max-width:900px){.tree .row4{grid-template-columns:1fr 1fr}.sk3{grid-template-columns:1fr}.health{grid-template-columns:repeat(5,minmax(0,1fr))}}
@media (max-width:560px){.tree .row4{grid-template-columns:1fr}.health{grid-template-columns:repeat(3,minmax(0,1fr))}.steps{grid-template-columns:1fr;gap:22px 0}.step::after{content:"↓";right:auto;left:50%;top:auto;bottom:-22px;transform:translateX(-50%)}.sbar>div{font-size:12.5px}}
@media (max-width: 900px) {
  .hero, .contact { grid-template-columns: minmax(0,1fr); }
  .sec-head, .xp { grid-template-columns: minmax(0,1fr); gap: 6px; }
  .work { grid-template-columns: minmax(0,1fr); gap: 22px; }
  .proof { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .proof > button { border-left: 0; padding: 24px 0; border-top: 1px solid var(--line); }
  .proof > button:nth-child(-n+2) { border-top: 0; }
  .proof > button:nth-child(even) { padding-left: 20px; border-left: 1px solid var(--line); }
  .skills { grid-template-columns: minmax(0,1fr); }
  .cs-sec { grid-template-columns: minmax(0,1fr); }
  .navlinks .hide-sm, .brand small { display: none; }
}
@media (max-width: 560px) {
  .proof { grid-template-columns: minmax(0,1fr); }
  .proof > button, .proof > button:nth-child(even) { padding: 22px 0; border-left: 0; border-top: 1px solid var(--line); }
  .proof > button:first-child { border-top: 0; }
  .tt .tr { grid-template-columns: minmax(0,1fr); }
  .tt .th { display: none; }
  .facts { grid-template-columns: minmax(0,1fr); }
  .facts > div { border-left: 0 !important; border-top: 1px solid var(--line) !important; }
  .facts > div:first-child { border-top: 0 !important; }
  .sheet .row { grid-template-columns: 70px minmax(0,1fr); padding: 14px 16px; }
  .lane { grid-template-columns: minmax(0,1fr); gap: 2px; } .lane .ln { padding-top: 0; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }
.hero h1 em{white-space:normal}
.mt th{white-space:nowrap}
body{line-height:1.7;line-break:auto}
</style>
</head>
